<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="观看 AIQuota Touch Bar 演示：在 Mac 菜单栏和触控栏查看 AI 额度、会话状态与本轮工作路线。">
  <title>AIQuota Touch Bar · 演示视频</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #11131a; color: #eef0f5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: 100%; max-width: 1008px; margin: 0 auto; padding: 40px 24px 56px; }
    h1 { margin: 0 0 12px; font-size: clamp(26px, 5vw, 38px); line-height: 1.2; }
    p { margin: 0 0 20px; color: #bec4d1; line-height: 1.7; }
    a { color: #afc7ff; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid #afc7ff; outline-offset: 5px; }
    video, img { display: block; width: 100%; max-width: 960px; height: auto; border-radius: 12px; background: #000; }
    video { aspect-ratio: 16 / 9; }
    nav { display: flex; flex-wrap: wrap; gap: 12px 24px; margin: 20px 0; line-height: 1.6; }
    h2 { margin: 40px 0 18px; font-size: 22px; }
    figure { margin: 0 0 28px; }
    figcaption { margin-top: 10px; color: #bec4d1; line-height: 1.6; }
    footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid #333845; }
    footer p { margin: 0; font-size: 14px; }
    @media (max-width: 600px) { main { padding: 28px 16px 40px; } nav { gap: 10px 18px; } }
  </style>
</head>
<body>
  <main>
    <h1>AIQuota Touch Bar</h1>
    <p>把 AI 的工作进展、剩余额度和一只小猫，放到 MacBook Pro 的触控栏上。</p>
    <video controls preload="metadata" poster="media/cover.png" playsinline>
      <source src="media/demo.mp4" type="video/mp4">
      你的浏览器无法播放此视频，可以<a href="media/demo.mp4" download="AIQuota-1080p.mp4">下载 1080p 原片</a>观看。
    </video>
    <nav aria-label="视频与项目链接">
      <a href="https://github.com/shuai9928/aiquota-touchbar">公开源码</a>
      <a href="media/demo.mp4" download="AIQuota-1080p.mp4">下载 1080p 原片</a>
      <a href="media/demo.srt" download="AIQuota-demo.srt">SRT 字幕</a>
      <a href="https://github.com/shuai9928/aiquota-touchbar/blob/main/docs/media/README.md">媒体来源与署名</a>
    </nav>
    <p>完整演示约 1 分 40 秒，使用示例任务与模拟额度，包含画面字幕和旁白。</p>
    <h2>视频截图</h2>
    <figure>
      <a href="media/workflow.png"><img src="media/workflow.png" alt="AIQuota 触控栏显示示例任务的阅读、修改与测试路线" loading="lazy"></a>
      <figcaption>本轮工作路线：阅读、修改与测试。</figcaption>
    </figure>
    <figure>
      <a href="media/states.png"><img src="media/states.png" alt="AIQuota 路线节点用颜色区分等待、失败与完成" loading="lazy"></a>
      <figcaption>等待、失败与完成，在触控栏上及时看见。</figcaption>
    </figure>
    <footer>
      <p>项目源码采用 MIT 许可；配音、钢琴上游及其他第三方素材的范围见<a href="https://github.com/shuai9928/aiquota-touchbar/blob/main/docs/media/README.md">媒体来源与署名</a>。</p>
    </footer>
  </main>
